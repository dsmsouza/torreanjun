
        <!DOCTYPE html>
        <html>
        <head>
            <title>Mapa de Operações - SP (14/07)</title>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
            <style>
                body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
                #map { width: 100vw; height: 100vh; }
                .legend {
                    background: white;
                    padding: 15px;
                    line-height: 1.5em;
                    border-radius: 5px;
                    box-shadow: 0 0 15px rgba(0,0,0,0.2);
                }
                .legend i {
                    width: 18px;
                    height: 18px;
                    float: left;
                    margin-right: 8px;
                    opacity: 0.9;
                    border-radius: 50%;
                }
                .legend h4 { margin: 0 0 10px 0; }
            </style>
        </head>
        <body>
            <div id="map"></div>
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
            <script>
                var map = L.map('map').setView([-23.5505, -46.6333], 7);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 18,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                var markersData = [];
                var bounds = [];

                markersData.forEach(function(m) {
                    var marker = L.circleMarker([m.lat, m.lon], {
                        radius: 8,
                        fillColor: m.color,
                        color: '#fff',
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);
                    
                    marker.bindPopup(m.popup);
                    bounds.push([m.lat, m.lon]);
                });
                
                if(bounds.length > 0) {
                    map.fitBounds(bounds);
                }

                var legend = L.control({position: 'bottomright'});
                legend.onAdd = function (map) {
                    var div = L.DomUtil.create('div', 'legend');
                    div.innerHTML += '<h4>Legenda de Ocorrências (SP)</h4>';
                    div.innerHTML += '<i style="background: #FFA500"></i> Bipou após caminhão passar<br>';
                    div.innerHTML += '<i style="background: #FF0000"></i> Erro - Não abriu coleta<br>';
                    div.innerHTML += '<i style="background: #8B0000"></i> Erro - Não fechou coleta<br>';
                    div.innerHTML += '<i style="background: #800080"></i> Backlog Real (Sem caminhão)<br>';
                    return div;
                };
                legend.addTo(map);
            </script>
        </body>
        </html>
